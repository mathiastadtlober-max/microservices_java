name: teste-resilience-patterns
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Consul + bancos
        run: |
          docker run -d --name consul --network host hashicorp/consul:1.20 agent -dev -client 0.0.0.0
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -c "create database db_product"
          psql -h localhost -U postgres -c "create database db_currency"
          sleep 5
          python3 - <<'PY'
          import shlex, urllib.request
          for line in open('start_consul.bat', encoding='utf-8'):
              if line.startswith('consul kv put'):
                  _,_,_,k,v = shlex.split(line.strip())
                  req = urllib.request.Request('http://localhost:8500/v1/kv/'+k, data=v.encode(), method='PUT')
                  print(k, urllib.request.urlopen(req).read())
          PY
      - name: Build currency-api
        run: cd currency-api && mvn -B -ntp package -DskipTests
      - name: Build product-api
        run: cd product-api && mvn -B -ntp package -DskipTests
      - name: Sobe as APIs
        run: |
          nohup java -jar currency-api/target/*.jar > currency.log 2>&1 &
          echo $! > currency.pid
          nohup java -jar product-api/target/*.jar > product.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8100/actuator/health >/dev/null && curl -sf localhost:8000/actuator/health >/dev/null && break; sleep 2; done
          curl -s localhost:8000/actuator/health | jq -c '.status'
          sleep 10
      - name: Testes
        run: |
          set -x
          C='Chamando currency-api: USD -> BRL'
          echo "== 1. Conversao normal"
          curl -s "localhost:8000/products/1?targetCurrency=BRL" | tee r1.json | jq .
          jq -e '.convertedPrice > 0' r1.json
          echo "== 2. Cache: segunda chamada nao deve chamar o currency-api"
          curl -s "localhost:8000/products/1?targetCurrency=BRL" | jq -c '.convertedPrice'
          test "$(grep -c "$C" product.log)" = 1
          echo "== 3. Fallback + Retry: derruba o currency-api"
          kill $(cat currency.pid); sleep 3
          start=$(date +%s)
          curl -s "localhost:8000/products/1?targetCurrency=EUR" | tee r3.json | jq .
          echo "tempo: $(( $(date +%s) - start ))s"
          jq -e '.convertedPrice == -1' r3.json
          test "$(grep -c 'Chamando currency-api: USD -> EUR' product.log)" = 3
          echo "== 4. Circuit Breaker"
          curl -s "localhost:8000/products/1?targetCurrency=GBP" | jq -c '{convertedPrice, environment}'
          curl -s localhost:8000/actuator/circuitbreakers | tee cb.json | jq .
          jq -e '.circuitBreakers["currency-api"].state == "OPEN"' cb.json
          before=$(grep -c 'Chamando currency-api' product.log)
          curl -s "localhost:8000/products/1?targetCurrency=MXN" | tee r4.json | jq -c '{convertedPrice, environment}'
          test "$(grep -c 'Chamando currency-api' product.log)" = "$before"
          grep -q 'OPEN' r4.json
          echo "== 5. Cache continua respondendo BRL com o currency-api fora"
          curl -s "localhost:8000/products/1?targetCurrency=BRL" | tee r5.json | jq -c '.convertedPrice'
          jq -e '.convertedPrice > 0' r5.json
          echo "TODOS OS TESTES PASSARAM"
      - name: Logs
        if: always()
        run: |
          echo "----- product-api"; grep -vE 'DEBUG' product.log | tail -80
          echo "----- currency-api"; tail -40 currency.log
