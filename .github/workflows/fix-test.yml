name: teste-correcoes
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Consul + bancos
        run: |
          docker run -d --name consul --network host hashicorp/consul:1.20 agent -dev -client 0.0.0.0
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -c "create database db_product"
          psql -h localhost -U postgres -c "create database db_currency"
          sleep 5
          python3 - <<'PY'
          import shlex, urllib.request
          for line in open('start_consul.bat', encoding='utf-8'):
              if line.startswith('consul kv put'):
                  _,_,_,k,v = shlex.split(line.strip())
                  req = urllib.request.Request('http://localhost:8500/v1/kv/'+k, data=v.encode(), method='PUT')
                  urllib.request.urlopen(req).read()
          PY
      - name: Build
        run: |
          (cd currency-api && mvn -B -ntp -q package -DskipTests)
          (cd product-api && mvn -B -ntp -q package -DskipTests)
      - name: Testes
        run: |
          set -eu
          ok() { echo "  OK - $1"; }
          p() { curl -s "localhost:8000/products/1?targetCurrency=$1" | tee p.json | jq -c '{brand, model, description, convertedPrice, environment}'; }
          nohup java -jar currency-api/target/*.jar > currency.log 2>&1 &
          echo $! > currency.pid
          nohup java -jar product-api/target/*.jar > product.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8100/actuator/health >/dev/null && curl -sf localhost:8000/actuator/health >/dev/null && break; sleep 2; done
          sleep 10
          echo "== Campos do produto na ordem certa"
          p BRL
          jq -e '.brand == "Apple" and .convertedPrice > 0' p.json; ok "brand=Apple e conversao via BCB"
          jq -e '.environment | contains("BCB PTAX")' p.json; ok "cotacao veio do BCB"
          echo "== 404 via product-api: sem retry e sem contar no Circuit Breaker"
          for i in 1 2 3 4; do p XYZ; jq -e '.convertedPrice == -1' p.json >/dev/null; done
          test "$(grep -c 'Chamando currency-api: USD -> XYZ' product.log)" = 4; ok "4 requisicoes = 4 chamadas (nenhum retry)"
          curl -s localhost:8000/actuator/circuitbreakers | tee cb.json | jq -c '.circuitBreakers["currency-api"] | {state, failureRate, failedCalls, bufferedCalls}'
          jq -e '.circuitBreakers["currency-api"].state == "CLOSED"' cb.json; ok "circuito do product-api continua CLOSED"
          p EUR; jq -e '.convertedPrice > 0' p.json; ok "outras conversoes continuam funcionando"
          echo "== Regressao: falha real (currency-api fora) continua com retry e circuit breaker"
          kill $(cat currency.pid); sleep 3
          p GBP; jq -e '.convertedPrice == -1' p.json
          test "$(grep -c 'Chamando currency-api: USD -> GBP' product.log)" = 3; ok "3 tentativas para falha real"
          p JPY >/dev/null
          curl -s localhost:8000/actuator/circuitbreakers | tee cb.json | jq -c '.circuitBreakers["currency-api"].state'
          jq -e '.circuitBreakers["currency-api"].state == "OPEN"' cb.json; ok "circuito abre para falhas reais"
          echo "TODOS OS TESTES PASSARAM"
      - name: Logs
        if: always()
        run: grep -E 'Chamando currency-api|ERROR' product.log | tail -30
